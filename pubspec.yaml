name: party_tricks
description: "Party Tricks: juego 2D multijugador por turnos con minijuegos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_database: ^13.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.4
  image: ^4.12.0
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Imágenes del juego (fondo, personaje, etc.).
  assets:
    - assets/images/
    - assets/images/cofres/
    - assets/images/juego/
    - assets/images/mapa/piezas/
    - assets/images/personaje/
    - assets/images/personaje/accesorios/
    - assets/images/personaje/frente/bocas/
    - assets/images/personaje/frente/camisas/
    - assets/images/personaje/frente/cabellos/
    - assets/images/personaje/frente/cuerpo/
    - assets/images/personaje/frente/ojos/
    - assets/images/personaje/frente/pantalones/
    - assets/images/personaje/lado/bocas/
    - assets/images/personaje/lado/camisas/
    - assets/images/personaje/lado/cabellos/
    - assets/images/personaje/lado/cuerpo/
    - assets/images/personaje/lado/ojos/
    - assets/maps/mapa_01/

  # Tipografía del mockup.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700